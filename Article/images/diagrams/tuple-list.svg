"514" width="126" height="52" rx="8" class="node"/><text x="549.0" y="546.0" class="mono value" text-anchor="middle">100</text><rect x="56" y="423" width="112" height="52" rx="8" class="node"/><text x="112.0" y="455.0" class="mono code" text-anchor="middle">list1</text><path d="M168 449 H240" class="arrow" marker-end="url(#arrow)"/><text x="360" y="661" class="subtitle" text-anchor="middle">元组索引 3 处的指向不变，变化发生在列表内部。</text></svg>